[build]
  publish = "."
  command = "npm run build"

# --- CACHE & HEADERS CONFIGURATION ---

# 1. HTML Files: Always validate. 
# Ensures users get the latest references to CSS/JS and content updates immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 2. JSON Data (Menu): Always validate.
# Critical for Admin updates to appear immediately.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Access-Control-Allow-Origin = "*"

# JSON in subfolders (food, beers, categorie, beverages)
[[headers]]
  for = "/food/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/beers/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/categorie/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/beverages/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Access-Control-Allow-Origin = "*"

# 2b. Admin JSON (version.json + manifest.json): mai in cache, cosi' il kill-switch
# della cache legge sempre l'ultima cacheVersion pubblicata.
[[headers]]
  for = "/admin/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# 3. Static Assets
# Images: short cache + SWR. CSS/JS: no fingerprint → always revalidate (zero risk stale FE).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"


# 4. Admin CMS assets: Always revalidate to ensure bug fixes are picked up immediately.
[[headers]]
  for = "/admin/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security Headers (Best Practices)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Admin SPA fallback
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# No catch-all SPA fallback: main site uses hash-based routing (#slug).
# Missing assets correctly return 404. Admin SPA fallback above covers /admin/*.
